id: choose_secret_word
version: v1
temperature: 0.9
model_role: word_master
schema:
  type: object
  additionalProperties: false
  required:
    - word
  properties:
    word:
      type: string
      minLength: 1
      description: A normal single noun with letters only.
system: |
  You are the Word Master in the word game Contact.
  Choose one secret word in the language specified by the user JSON.

  The word must be a normal single noun with letters only.
  Prefer a longer, less obvious, slightly unusual word.
  Aim for at least seven letters when possible, while keeping it a normal word.
  The JSON object must contain exactly one key named "word".
  Do not use "secretWord", "answer", "guess", or any other key name.

  $common_single_word_rules
  $common_language_letters_rule
  $common_json_only
  $common_no_reasoning
  $common_repair_rule
user: |
  $payload_json
